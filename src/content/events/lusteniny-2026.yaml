title: Luštěniny IX.
description: |
  Velké díky a potlesk
  Devátý ročník luštěnin je za námi. Rádi bychom vám poděkovali za vaši účast! Letos se nám sešlo 35 týmu v zhruba 120 členech! Opět o kousíček větší účast než minulý rok a my jsme za to velice rádi 🙂
  Tímto také bychom rádi zopakovali potlesk nejen vítězům ale i všem zúčastněným, kteří se pustili do letošních šifer (jaké že bylo to téma?). V následujících dnech na web nahrajeme galerii fotek, dokonce i s mini sekvencí “pozorování zatmění slunce včetně ochranných pomůcek” - na její vychutnání si určitě počkejte.
  Dále také zveřejníme kompletní bodovou tabulky včetně dalších statistik a nakonec pak na našem webu naleznete i zadání a řešení všech šifer.
  Pokud budete mít ještě na srdci něco co by jste nám rádi sdělili (jakože to bylo třeba moc jednoduché), tak nám napište zde na sítích, nebo využijte email info@lusteniny.eu. Budeme rádi za vaši zprávu 🙂
  Zatím ještě jednou díky a luštění zdar 🫛
